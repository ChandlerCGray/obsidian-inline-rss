name: Release

# Publishes main.js, manifest.json and styles.css to the GitHub release for a
# version tag (e.g. 1.0.0) with build provenance attestations.
# Runs on tag push, or manually for an existing tag.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish assets for, e.g. 1.0.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check manifest version matches tag
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$version" != "$TAG" ]; then
            echo "manifest.json version $version does not match tag $TAG" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --verify-tag
          fi
